<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Mini KASM{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/_variables.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="navbar">
    <a href="{{ url_for('home') }}" class="left">
      <img src="{{ url_for('static', filename='images/logo.svg') }}" class="logo" />
      <h2>Mini KASM</h2>
    </a>
    {% if session.get('user') %}
    <div class="user-info">
      <span class="user-badge">{{ session.get('user') }}</span>
      <form method="post" action="{{ url_for('logout') }}" style="display:inline;margin:0;">
        <button type="submit" class="logout-btn">Logout</button>
      </form>
    </div>
    {% endif %}
  </header>
  <div class="shell">
    <main class="container">
      {% block content %}{% endblock %}
    </main>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
